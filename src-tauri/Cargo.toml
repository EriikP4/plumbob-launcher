[package]
name = "s4im"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
s4im-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
