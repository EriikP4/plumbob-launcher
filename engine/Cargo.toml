[package]
name = "s4im-engine"
version = "0.3.0"
edition = "2021"
description = "Plumbob Launcher engine: instances, snapshots and activation. No UI or Tauri dependency."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
dirs = "6"
trash = "5"
blake3 = "1"
base64 = "0.22"
minisign-verify = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3"
