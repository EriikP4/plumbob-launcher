<!doctype html>
<html lang="es" style="background:#130f1c;color-scheme:dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Plumbob Launcher</title>
    <script>
      try {
        var bg = localStorage.getItem("plumbob-bg");
        if (bg) document.documentElement.style.background = bg;
      } catch (e) {}
    </script>
  </head>
  <body style="background:inherit">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
